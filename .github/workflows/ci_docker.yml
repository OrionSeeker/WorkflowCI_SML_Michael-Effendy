name: MLflow CI & Docker Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn

      - name: Run Mlflow
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      - name: Upload Artifak ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-artifak
          path: MLProject/saved_model/

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build + Push Docker Image
        run: |
          cd MLProject
          mlflow models build-docker -m saved_model -n ${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest
          
          docker push ${{ secrets.DOCKER_USERNAME }}/heart-disease-model:latest